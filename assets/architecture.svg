<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d">
<title id="t">task-queue-system request lifecycle</title>
<desc id="d">Animated flow: a client request passes the idempotency check, is queued in Redis and picked up by workers; a retry with the same key gets the saved response from the cache.</desc>
