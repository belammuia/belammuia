  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5eead4" stroke-opacity=".045"/></pattern>
  <clipPath id="card"><rect width="1000" height="490" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
