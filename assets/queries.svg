<rect x="530" y="207" width="410" height="9" rx="4.5" fill="#13233a"/><rect x="530" y="207" width="0" height="9" rx="4.5" fill="#5eead4"><animate attributeName="width" values="0;66;66;0" keyTimes="0;0.12;.95;1" dur="9s" repeatCount="indefinite"/></rect>
<text x="958" y="58" text-anchor="end" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#5eead4">2 queries</text>
<text x="500" y="256" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b">illustrative: 12 rows. select_related does the same job with a JOIN.</text>
