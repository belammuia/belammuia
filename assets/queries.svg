<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 266" width="1000" height="266" role="img" aria-labelledby="t d">
<title id="t">N+1 queries versus prefetch_related</title>
<desc id="d">Animated comparison: a naive loop issues one query per row and gets slower; prefetch_related batches the lookups into two queries.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1730"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
  <clipPath id="card"><rect width="1000" height="266" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="266" fill="url(#bg)"/>
<rect x="20" y="16" width="470" height="218" rx="16" fill="#0f1b2d" stroke="#1e3a4f" stroke-width="1.5"/>
<rect x="20.75" y="36" width="4" height="40" rx="2" fill="#f87171"/>
<text x="42" y="50" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">the naive loop</text>
<text x="42" y="70" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#64748b">N+1: one query for the list, one per row</text>
