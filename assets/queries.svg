n Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f87171">SELECT</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.385;0.393;0.95;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><rect x="186" y="152" width="65" height="22" rx="6" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".6"/><text x="218.5" y="167" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f87171">SELECT</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.43;0.438;0.95;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><rect x="259" y="152" width="65" height="22" rx="6" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".6"/><text x="291.5" y="167" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f87171">SELECT</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.475;0.483;0.95;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><rect x="332" y="152" width="65" height="22" rx="6" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".6"/><text x="364.5" y="167" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f87171">SELECT</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.528;0.95;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><rect x="405" y="152" width="65" height="22" rx="6" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".6"/><text x="437.5" y="167" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f87171">SELECT</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.565;0.573;0.95;1" dur="9s" repeatCount="indefinite"/></g>
<text x="42" y="204" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b">response time</text>
<rect x="40" y="207" width="410" height="9" rx="4.5" fill="#13233a"/><rect x="40" y="207" width="0" height="9" rx="4.5" fill="#f87171"><animate attributeName="width" values="0;410;410;0" keyTimes="0;0.7;.95;1" dur="9s" repeatCount="indefinite"/></rect>
<text x="468" y="58" text-anchor="end" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f87171">13 queries</text>
<rect x="510" y="16" width="470" height="218" rx="16" fill="#0f1b2d" stroke="#1e3a4f" stroke-width="1.5"/>
<rect x="510.75" y="36" width="4" height="40" rx="2" fill="#5eead4"/>
<text x="532" y="50" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">with prefetch_related</text>
<text x="532" y="70" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="11.5" fill="#64748b">the lookups batch into one extra query</text>
<g opacity="0"><rect x="530" y="94" width="170" height="22" rx="6" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".6"/><text x="615.0" y="109" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#5eead4">SELECT appointments</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.028;0.95;1" dur="9s" repeatCount="indefinite"/></g><g opacity="0"><rect x="530" y="124" width="260" height="22" rx="6" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".6"/><text x="660.0" y="139" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="10.5" fill="#5eead4">SELECT patients WHERE id IN (...)</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.07;0.078;0.95;1" dur="9s" repeatCount="indefinite"/></g>
